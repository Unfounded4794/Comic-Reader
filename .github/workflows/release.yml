name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            command: pack:win
          - os: ubuntu-24.04
            platform: Linux-x64
            command: pack:linux
          - os: macos-15
            platform: macOS-arm64
            command: pack:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Check release tag and native architecture
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package version');
          if (process.platform === 'darwin' && process.arch !== 'arm64') throw new Error('Apple Silicon runner required');
          NODE
      - run: npm ci
      - run: npm run models
      - run: npm test
      - run: npm run build
      - name: Desktop feature checks on Windows and Apple Silicon
        if: runner.os != 'Linux'
        run: npm run test:features
      - name: Desktop feature checks on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:features
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Bundle corresponding source
        if: runner.os == 'Windows'
        run: npm run pack:source
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Check all platforms and write checksums
        shell: bash
        run: |
          cd release
          version="${GITHUB_REF_NAME#v}"
          test -f "Panel-Reader-${version}-Windows-x64.exe"
          test -f "Panel-Reader-${version}-Windows-x64-Setup.exe"
          test -f "Panel-Reader-${version}-Linux-x64.AppImage"
          test -f "Panel-Reader-${version}-Linux-x64.tar.gz"
          test -f "Panel-Reader-${version}-macOS-arm64.zip"
          test -f "Panel-Reader-${version}-source.zip"
          sha256sum Panel-Reader-* > SHA256SUMS.txt
      - name: Upload to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --generate-notes --title "Panel Reader $GITHUB_REF_NAME"
          fi
