name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Optional completed build run to reuse for an upload retry'
        type: string
      release_tag:
        description: 'Matching version tag, required when reusing a build run'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.build_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            command: pack:win
          - os: ubuntu-24.04
            platform: Linux-x64
            command: pack:linux
          - os: macos-15
            platform: macOS-arm64
            command: pack:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Check release tag and native architecture
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package version');
          if (process.platform === 'darwin' && process.arch !== 'arm64') throw new Error('Apple Silicon runner required');
          NODE
      - run: npm ci
      - run: npm run models
      - run: npm test
      - run: npm run build
      - name: Desktop feature checks on Windows and Apple Silicon
        if: runner.os != 'Linux'
        run: npm run test:features
      - name: Desktop feature checks on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:features
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Bundle corresponding source
        if: runner.os == 'Windows'
        run: npm run pack:source
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.zip

  release:
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.build_run_id != '' && inputs.release_tag != '')) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
    steps:
      - name: Verify selected build matches release tag
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || !/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('A version tag and numeric build run are required');
          NODE
          gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha > expected-sha.txt
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync('build-run.json'));
          const jobs = JSON.parse(fs.readFileSync('build-jobs.json')).jobs.filter(j => j.name.startsWith('build ('));
          if (run.head_sha !== fs.readFileSync('expected-sha.txt', 'utf8').trim() || run.head_branch !== process.env.RELEASE_TAG || run.path !== '.github/workflows/release.yml') throw new Error('Build does not match the selected release tag');
          if (jobs.length !== 3 || jobs.some(j => j.conclusion !== 'success')) throw new Error('All three platform builds must succeed');
          NODE
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
      - name: Check all platforms and write checksums
        shell: bash
        run: |
          cd release
          version="${RELEASE_TAG#v}"
          test -f "Panel-Reader-${version}-Windows-x64.exe"
          test -f "Panel-Reader-${version}-Windows-x64-Setup.exe"
          test -f "Panel-Reader-${version}-Linux-x86_64.AppImage"
          test -f "Panel-Reader-${version}-Linux-x64.tar.gz"
          test -f "Panel-Reader-${version}-macOS-arm64.zip"
          test -f "Panel-Reader-${version}-source.zip"
          sha256sum Panel-Reader-* > SHA256SUMS.txt
      - name: Upload to a draft GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "Panel Reader $RELEASE_TAG"
          fi
